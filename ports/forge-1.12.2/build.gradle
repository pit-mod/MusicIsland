buildscript {
    repositories { mavenCentral(); maven { url 'https://maven.minecraftforge.net' } }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT' }
}
apply plugin: 'net.minecraftforge.gradle.forge'
version = '1.1.0'
group = 'io.github.pitmod'
archivesBaseName = 'MusicIsland-forge-1.12.2'
sourceCompatibility = targetCompatibility = '1.8'
compileJava.options.encoding = 'UTF-8'
minecraft {
    // 2847 is the last published userdev compatible with ForgeGradle 2.3.
    // The resulting mod uses the same public 1.12.2 APIs on newer Forge builds.
    version = '1.12.2-14.23.5.2847'
    mappings = 'stable_39'
    runDir = 'run'
}
repositories { mavenCentral(); maven { url 'https://repo.polyfrost.org/releases' } }
configurations { embed }
dependencies {
    compileOnly('cc.polyfrost:oneconfig-1.12.2-forge:0.2.2-alpha228') { transitive = false }
    compileOnly('cc.polyfrost:universalcraft-1.12.2-forge:246') { transitive = false }
    embed('cc.polyfrost:oneconfig-wrapper-launchwrapper:1.0.0-beta17') { transitive = false }
}
def original = file('../..')
task prepareCompatibilitySource(type: Copy) {
    inputs.property 'adapterRevision', 2
    from(new File(original, 'src/main/java')) { exclude '**/MusicIslandGuiFactory.java' }
    into "$buildDir/compatibility/java"
    filter { String line ->
        line.replace('.theWorld', '.world').replace('.thePlayer', '.player')
            .replace('.fontRendererObj', '.fontRenderer')
            .replace('e.type', 'e.getType()').replace('e.gui', 'e.getGui()')
            .replace('getCommandName()', 'getName()')
            .replace('getCommandUsage(ICommandSender sender)', 'getUsage(ICommandSender sender)')
            .replace('processCommand(ICommandSender sender,String[] args)', 'execute(net.minecraft.server.MinecraftServer server,ICommandSender sender,String[] args)')
            .replace('version="1.0.1"', 'version="1.1.0"')
            .replace('acceptedMinecraftVersions="[1.8.9]"', 'acceptedMinecraftVersions="[1.12.2]"')
    }
}
sourceSets.main.java.srcDirs = ["$buildDir/compatibility/java", 'src/main/java']
sourceMainJava.dependsOn prepareCompatibilitySource
task buildMusicIslandHelper(type: Exec) {
    workingDir original
    inputs.files(fileTree(new File(original, 'music-island-helper')) { include '*.cs', '*.csproj' })
    outputs.file new File(original, 'build/music-island-helper/MusicSessionBridge.exe')
    commandLine 'dotnet', 'publish', 'music-island-helper/MusicSessionBridge.csproj', '-c', 'Release', '-r', 'win-x64', '-o', 'build/music-island-helper'
}
processResources {
    dependsOn buildMusicIslandHelper
    from(new File(original, 'src/main/resources')) {
        include 'mcmod.info'
        expand version: project.version
        filter { String line -> line.replace('"mcversion": "1.8.9"', '"mcversion": "1.12.2"') }
    }
    from(new File(original, 'src/main/resources')) { exclude 'mcmod.info' }
    from(new File(original, 'build/music-island-helper')) { include 'MusicSessionBridge.exe'; into 'assets/musicisland/music' }
    from(new File(original, 'licenses')) { into 'META-INF/licenses' }
    from(new File(original, 'THIRD_PARTY_NOTICES.md')) { into 'META-INF' }
}
jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.embed.collect { zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
    manifest.attributes('ModSide':'CLIENT', 'ForceLoadAsMod':'true', 'TweakOrder':'0', 'TweakClass':'cc.polyfrost.oneconfig.loader.stage0.LaunchWrapperTweaker')
}
